<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Keeper</title>
</head>

<body>
    <h1 id="score"><span id="player1Display">0</span> to <span id="player2Display">0</span></h1>
    <span>Use the buttons below to keep score</span>

    <div>Playing to
        <select name="playTo" id="playTo">
            <option value="5">5</option>
            <option value="7">7</option>
            <option selected value="11">11</option>
        </select>
    </div>
    <button id="player1">+1 Player One</button>
    <button id="player2">+1 Player Two</button>
    <button id="reset">Reset</button>
    <script src="app.js"></script>
</body>

</html>
